interface:
  display_name: "Vibe Control"
  short_description: "用目标缰绳、检查点与定点复核自动推进可验证开发"
  default_prompt: "Use $vibe-control 0.3.7 to derive and lock key objectives, require an explicit MANUAL_STAGE_CONFIRMATION, AUTO_LOCAL_TO_REVIEW, or AUTO_PUSH_TO_REVIEW startup choice, establish the Schema 3.2 control plane, and run the advance workflow through CODEX_THREADS → SUBAGENTS → SERIAL until a fixed owner-review point. At that point render the read-only offline Dashboard from the same validation projection and stop for the one required human decision."

policy:
  allow_implicit_invocation: true
